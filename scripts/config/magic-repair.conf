# Default device filter; ALL terms must occur in the name, ignoring ASCII case.
# Override with -s/--search or --device on the command line.
# Personal config: ${XDG_CONFIG_HOME:-~/.config}/magic-repair/config
# This file is parsed as data, never sourced as shell code.
#
# Legacy syntax (split on whitespace):
search_terms="Magic Jonas"
#
# Alternatively, use one literal term/phrase per line:
# search_term="Magic Trackpad"
# search_term="Jonas"
#
# For fixed targets, replace the search terms with device entries:
# device="AA:BB:CC:DD:EE:FF"
# device="11:22:33:44:55:66"
