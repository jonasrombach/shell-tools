version: 2
updates:
  - package-ecosystem: pip
    directory: /scripts/lib/magic-repair
    schedule:
      interval: weekly
    groups:
      runtime:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 3
